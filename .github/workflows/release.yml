name: Release

# 打 v* 标签 → 真打包一次（Windows 单文件 exe + Linux AppImage）→ 建 Release 把两个附件都传上去。
# 为什么放 CI 而不是本机手工传：手工那次没人能复现「这个 exe / AppImage 到底是哪个 commit 打的」，
# 而这里 tag 与包内 __version__ 会先对一次账，产物还带 GitHub 服务端算的 SHA256。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动跑一次只产出 artifact（不建 release）

permissions:
  contents: write               # 建 release / 传附件需要

# ⚠️ 必须开 UTF-8：Windows runner 的 stdout 默认是 cp1252，脚本里带 emoji/中文的 print
# 会 UnicodeEncodeError 直接打挂这一步（CI 上实测过 check_no_secrets.py 崩在「✅」）。
env:
  PYTHONUTF8: "1"

jobs:
  # ① Linux：AppImage（构建 + 独立验收）。
  #
  # 步骤本体在 `.github/workflows/appimage.yml` —— 与 CI 用的是**同一份**（系统依赖清单、
  # Tcl/Tk 版本进 cache key、构建→验收的顺序都只写一处；抄一遍迟早只改一处，#12 的教训）。
  # 这里拿到的 artifact 会在下面 `build` 里取回来，和 exe 一起当 Release 附件发出去。
  appimage:
    uses: ./.github/workflows/appimage.yml

  # ② Windows：单文件 exe + 组装 Release。
  #
  # ⚠️ `needs: appimage` 是**故意的**：宁可整体红，也不要静默发一个「只有 exe」的版本 ——
  #    Linux 用户照指南去附件里找 AppImage 却找不到，而这种「少了一半」不会有人报错。
  #    （仓库里同口径：发布路径上缺 Windows 独占依赖也要红灯，见下面的依赖门禁。）
  #    真要接受「AppImage 挂了也照发 exe」，把这个 needs 删掉即可。
  build:
    needs: appimage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 打包脚本会读 git HEAD 做版本溯源

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # 与 README 要求一致（3.12 未测）

      - name: 对账 tag 与包内版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path vlt/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $py = $m.Matches[0].Groups[1].Value
          Write-Host "tag=$tag  包内 __version__=$py"
          if ($tag -ne $py) {
            Write-Error "tag 与 vlt/__init__.py 的 __version__ 不一致：先改代码再打 tag"
            exit 1
          }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install "pyinstaller>=6.6"

      # ★ 依赖门禁：这是**真正发布**的路径，缺了 openvr / pyaudiowpatch
      #   会静默产出「没有 SteamVR 手腕屏、没有 VRChat 音频下拉」的 exe。
      - name: 断言 Windows 独占依赖可导入
        run: python -c "import openvr, pyaudiowpatch; print('Windows 独占依赖 OK')"

      - name: 打包单文件 exe
        # --no-verify：打完自带的自检要真 API key + 联网，CI 里没有 → 跳过
        run: python scripts/build_exe.py --no-verify

      # Linux 附件来自上面 `appimage` job（可复用 workflow 的产物）。
      # 单个文件的 artifact 里存的就是文件名本身 → 下到 dist/ 即 dist/xxx.AppImage。
      # ⚠️ 必须放在下面「自检产物」**之前**：那一步会断言 AppImage 已经在 dist/ 里
      #    （第一次跑就是顺序错了，在 fork 上实测到「没找到 Linux 附件」→ 这一步炸）。
      # ⚠️ `download-artifact` 的 major 要与 appimage.yml 里 `upload-artifact` 的 major 配对
      #    （现在两边都是 v4）：跨 major 取不到东西，而这一步只在打 tag 时才跑，容易没人发现。
      - name: 取回 AppImage 产物（Linux 附件）
        uses: actions/download-artifact@v4
        with:
          name: VRChatLiveTranslate-AppImage
          path: dist

      - name: 自检产物（存在性 / 大小）
        shell: pwsh
        run: |
          $exe = "dist/VRChatLiveTranslate.exe"
          if (-not (Test-Path $exe)) { Write-Error "没找到产物 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("产物：{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
          if ($f.Length -lt 20MB) { Write-Error "产物体积异常（<20MB），大概率没打全"; exit 1 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # ⚠️ 过渡期必须继续产出 SHA256SUMS.txt：**≤ v0.2.0 的老客户端把「exe + SHA256SUMS.txt
          #    两个附件」写死在更新检查里**，缺一个就静默地永远查不到新版本（v0.2.0 → v0.2.1 实测踩到）。
          #    新客户端优先用 GitHub 的 asset digest，这个文件纯粹给老客户端兜底。
          #    ★ 只写 exe 一行：老客户端是拿 exe 的名字去这个文件里找校验值的；往里塞 AppImage
          #      没有好处还有风险。AppImage 的校验值看 GitHub 附件旁的 digest（点一下即可复制）。
          "$hash  VRChatLiveTranslate.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Write-Host ("sha256：{0}" -f $hash)

          # Linux 附件必须**真的在这儿**：`needs: appimage` 只保证那个 job 成功，
          # 取回来这一步要是没落进 dist/，就得在这里炸掉，而不是发一个只有 exe 的 Release。
          $img = "dist/VRChatLiveTranslate-x86_64.AppImage"
          if (-not (Test-Path $img)) { Write-Error "没找到 Linux 附件 $img（appimage job 的产物没取回来？）"; exit 1 }
          $i = Get-Item $img
          Write-Host ("产物：{0}  {1:N1} MB" -f $i.Name, ($i.Length / 1MB))
          if ($i.Length -lt 40MB) { Write-Error "AppImage 体积异常（<40MB），大概率没打全"; exit 1 }

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 建 Release 并附上 exe + AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # ⚠️ 关掉自动附加的「What's Changed / New Contributors」（用户 2026-09 明确要求）：
          #    说明**只留「这版有什么」**这一段，自动附的那两节与 Full Changelog 都不要。
          #    所以每个版本都必须手写上面这段 body —— 别指望 GitHub 替你列 PR。
          generate_release_notes: false
          body: |
            ### 这版有什么

            **海外线路换成「千问云·海外版（Qwen Cloud）」**

            原来的海外线路走阿里云百炼·国际版 —— 注册要绑卡、还要过风控，很多人卡在第一步。
            现在整条线路换成 [千问云·海外版](https://www.qwencloud.com/)：**Google / GitHub / 邮箱
            就能注册**，不用手机号、不用绑卡。

            - 设置里选「千问云·海外版」再填 key 即可。⚠️ **两版的 key 不通用**：国内版的 key 填到
              海外版会直接 401。
            - 「地域」「业务空间」两个输入框删掉了 —— 海外版是公共域名，不需要这些，也不用再查
              自己属于哪个地域。
            - 老配置（选过旧国际版线路的）启动时会**自动迁移**到新线路，不用手改；迁移会在日志里
              留一行。
            - 日志里 `[net] 线路=… host=…` 一行能看出当前连的是哪条线。

            **「关于」页新增赞助者名单**

            感谢这些朋友的支持（名单是数据驱动的，加人只改一行代码）。

          files: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
            dist/VRChatLiveTranslate-x86_64.AppImage
          fail_on_unmatched_files: true
